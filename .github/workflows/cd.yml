# Bookio Backend — CD Pipeline
# Se activa después de que el CI pasa en main (merge de PR)
name: CD — Deploy

on:
  workflow_run:
    workflows: ['CI — Lint & Tests']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Build del proyecto
        run: npm run build

      - name: Validar build exitoso
        run: |
          echo "Build completado exitosamente."
          ls -la dist/src/ || echo "Directorio dist/src no encontrado"

      - name: Configurar SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/bookio-key.pem
          chmod 600 ~/.ssh/bookio-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          bash scripts/deploy.sh \
            --host ${{ secrets.EC2_HOST }} \
            --user ec2-user \
            --key ~/.ssh/bookio-key.pem \
            --skip-build
